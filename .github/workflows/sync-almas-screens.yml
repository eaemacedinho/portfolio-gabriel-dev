name: Sync Almas screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/sync-almas-assets.mjs]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-almas-assets.mjs
      - name: Commit original screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/almas
          if ! git diff --cached --quiet; then
            git commit -m "assets: cache real Almas iOS screenshots"
            git pull --rebase origin main
            git push
          fi
